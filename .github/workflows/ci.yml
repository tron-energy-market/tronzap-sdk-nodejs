name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Windows runners default to PowerShell.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: Node.js ${{ matrix.node }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['20', '22', '24', '26']
        # macOS and Windows are here for the platform-specific network and TLS error classification.
        include:
          - os: macos-latest
            node: '24'
          - os: windows-latest
            node: '24'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm run coverage

  runtimes:
    name: ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: Bun
            script: test:bun
          - runtime: Deno
            script: test:deno
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - if: matrix.runtime == 'Bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - if: matrix.runtime == 'Deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Test
        run: npm run ${{ matrix.script }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: ESLint, Prettier and TypeScript
        run: npm run lint

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The oldest supported Node.js, so the installed package is checked on it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build and check the exports
        run: |
          npm run build
          npm run check-package

      - name: Pack
        run: |
          npm pack --json --ignore-scripts > pack.json
          jq -r '.[0].files[].path' pack.json | sort | tee files.txt
          if grep -vE '^(dist/index\.(js|mjs|d\.ts|d\.mts)(\.map)?|README(\.[a-z-]+)?\.md|CHANGELOG\.md|LICENSE|package\.json)$' files.txt; then
            echo "::error::unexpected files in the package"
            exit 1
          fi
          for file in dist/index.js dist/index.mjs dist/index.d.ts dist/index.d.mts; do
            grep -qx "$file" files.txt || { echo "::error::$file is missing from the package"; exit 1; }
          done
          echo "TARBALL=$PWD/$(jq -r '.[0].filename' pack.json)" >> "$GITHUB_ENV"

      - name: Install the package into an empty project
        working-directory: ${{ runner.temp }}
        run: |
          mkdir consumer && cd consumer
          npm init --yes > /dev/null
          npm install --no-audit --no-fund "$TARBALL"
          node -e 'const sdk = require("tronzap-sdk"); console.log("require", sdk.VERSION, typeof sdk.TronZapClient)'
          node --input-type=module -e 'import { VERSION, TronZapClient } from "tronzap-sdk"; console.log("import", VERSION, typeof TronZapClient)'
          test "$(npm ls --omit=dev --parseable --all | wc -l)" -eq 2 || { npm ls --all; echo "::error::the package has dependencies"; exit 1; }
