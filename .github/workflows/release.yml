name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

  build:
    name: Check and pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Check that the tag matches the package version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          if ! grep -qx "export const VERSION = '${version}';" src/version.ts; then
            echo "::error::src/version.ts does not export VERSION ${version}"
            exit 1
          fi

      - name: Check that the changelog has the version
        run: |
          if ! grep -q "^## \[${GITHUB_REF_NAME#v}\] - " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: |
          npm run build
          npm run check-package

      - name: Pack
        run: |
          mkdir package
          npm pack --ignore-scripts --pack-destination package
          tar -tzf package/*.tgz

      - name: Upload the package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: package/
          if-no-files-found: error

  # Runs no build or test code: only this job can mint the OIDC token that npm exchanges for a publish token.
  # The trusted publisher on npm is stage-only, so the version goes live once a maintainer approves it with 2FA.
  publish:
    name: Stage on npm
    needs: [test, build]
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/tronzap-sdk
    permissions:
      id-token: write
    steps:
      # Staged publishing needs npm 11.15.0 or newer.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          registry-url: https://registry.npmjs.org

      - name: Download the package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: package/

      - name: Check the npm version
        run: |
          version="$(npm --version)"
          node -e '
            const [major, minor] = process.argv[1].split(".").map(Number);
            process.exit(major > 11 || (major === 11 && minor >= 15) ? 0 : 1);
          ' "$version" || { echo "::error::npm ${version} cannot stage a package"; exit 1; }

      - name: Stage
        run: npm stage publish package/*.tgz

  github-release:
    name: Draft the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GitHub renders every line break of release notes, so wrapped changelog lines are joined back.
      - name: Extract the release notes from the changelog
        run: |
          awk -v heading="## [${GITHUB_REF_NAME#v}]" '
            function flush() { if (buf != "") print buf; buf = "" }
            index($0, heading) == 1 { found = 1; next }
            !found { next }
            /^## \[/ { exit }
            /^```/ { flush(); fence = !fence; print; next }
            fence { print; next }
            /^[ \t]*$/ { flush(); print ""; next }
            /^(#|\|)/ { flush(); print; next }
            /^[ \t]*([-*+]|[0-9]+\.) / { flush(); buf = $0; next }
            { line = $0; sub(/^[ \t]+/, "", line); buf = buf == "" ? line : buf " " line }
            END { flush() }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md"
